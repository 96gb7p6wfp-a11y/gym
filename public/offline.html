<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#151c19" />
    <title>Setline — offline</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left)); color: #f0f4e8; background: #151c19; font-family: system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; background: #202b24; border-radius: 24px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 20px; }
      h1 { font-size: 24px; }
      p { color: #b9c4b4; line-height: 1.6; }
      a { display: inline-block; min-height: 48px; padding: 14px 24px; border-radius: 12px; color: #151c19; background: #d6eead; text-decoration: none; }
      a:focus-visible { outline: 3px solid #d6eead; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Your training goes with you</h1>
      <p>Once Setline has loaded and finished installing, your workouts and saved progress are available offline. Reconnect once if this is your first visit or the app has not finished downloading.</p>
      <a href="/">Open Setline</a>
    </main>
  </body>
</html>
