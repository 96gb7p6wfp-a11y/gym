<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <title>Setline — connection needed</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 24px; color: #172034; background: #f5f7fb; font-family: system-ui, sans-serif; }
      main { width: min(100%, 420px); padding: 32px; background: white; border-radius: 24px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 20px; }
      h1 { font-size: 24px; }
      p { color: #647084; line-height: 1.6; }
      a { display: inline-block; min-height: 48px; padding: 14px 24px; border-radius: 12px; color: white; background: #2563eb; text-decoration: none; }
      a:focus-visible { outline: 3px solid #172034; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Connect to open Setline</h1>
      <p>The gym website needs an internet connection. Reconnect, then open the app again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
